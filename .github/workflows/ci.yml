name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build app bundle
        run: |
          make bundle
          codesign --verify --deep --strict --verbose=2 .build/BreakBar.app
          otool -L .build/BreakBar.app/Contents/MacOS/BreakBar | grep -F '@rpath/Sparkle.framework/Versions/B/Sparkle'
          test -d .build/BreakBar.app/Contents/Frameworks/Sparkle.framework
          test -f .build/BreakBar.app/Contents/Resources/ThirdPartyLicenses/Sparkle.txt

      - name: Test
        run: make test

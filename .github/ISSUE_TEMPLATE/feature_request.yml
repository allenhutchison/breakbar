name: Feature request
description: Suggest an improvement to BreakBar
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Issues are welcome for discussion. Filing an issue is not approval to open a pull request; wait for explicit maintainer signoff before implementing a change for this repository.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible outcome rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any workarounds or simpler approaches you considered.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundaries
      options:
        - label: The Mac remains fully usable without external hardware.
          required: true
        - label: The proposal does not require collecting unnecessary personal data.
          required: true
        - label: I understand this issue is not approval to open a pull request; I will wait for explicit maintainer signoff.
          required: true

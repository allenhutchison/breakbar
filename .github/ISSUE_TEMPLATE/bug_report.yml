name: Bug report
description: Report a reproducible problem in BreakBar
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. For security or privacy vulnerabilities, stop here and use the private reporting link in SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: BreakBar version
      description: Find this in BreakBar Settings.
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: 26.0
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Remove credentials, calendar titles, personal file paths, and other unrelated personal data before attaching logs or screenshots.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain a security vulnerability or sensitive personal data.
          required: true
        - label: I understand this issue is not approval to open a pull request; I will wait for explicit maintainer signoff.
          required: true
